<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- weighted companion cube, front view: a dark body plate, four chamfered corner blocks that stick out a bit
       over the body, a small tab in the middle of each edge, and a round plate with the heart in the center. The
       gaps between the blocks form a cross with pink seams. -->
  <defs>
    <!-- corner block at the top left, the other corners use it with a rotation -->
    <g id="corner">
      <path d="M1.4 0.3H4.6L5.6 1.3V4.2L4.2 5.6H1.3L0.3 4.6V1.4z" fill="#e2e4e2"/>
      <path d="M1.6 0.8H4.4L5.1 1.5V4L3.9 5.1H1.5L0.8 4.4V1.6z" fill="#f6f7f5"/>
      <path d="M4.4 0.8L5.1 1.5V4L3.9 5.1H1.5L0.8 4.4" fill="none" stroke="#c4c7c6" stroke-width="0.3"/>
    </g>
    <!-- tab in the middle of the top edge -->
    <g id="tab">
      <path d="M6.6 0.6H9.4V2.6L9 3H7L6.6 2.6z" fill="#e2e4e2"/>
      <path d="M6.9 0.9H9.1V2.4L8.8 2.7H7.2L6.9 2.4z" fill="#f6f7f5"/>
    </g>
  </defs>
  <rect x="1" y="1" width="14" height="14" rx="1.2" fill="#5e6163"/>
  <!-- the cross of the gaps is a bit darker -->
  <path d="M7.2 1h1.6v14H7.2zM1 7.2h14v1.6H1z" fill="#4c4f51"/>
  <!-- pink seams -->
  <path d="M8 3v1.4M8 11.6V13M3 8h1.4M11.6 8H13" stroke="#e98db1" stroke-width="0.35" stroke-linecap="round"/>
  <use href="#corner"/>
  <use href="#corner" transform="rotate(90 8 8)"/>
  <use href="#corner" transform="rotate(180 8 8)"/>
  <use href="#corner" transform="rotate(270 8 8)"/>
  <use href="#tab"/>
  <use href="#tab" transform="rotate(90 8 8)"/>
  <use href="#tab" transform="rotate(180 8 8)"/>
  <use href="#tab" transform="rotate(270 8 8)"/>
  <!-- heart plate -->
  <circle cx="8" cy="8" r="4.1" fill="#7b7e80"/>
  <circle cx="8" cy="8" r="3.3" fill="#f6f7f5"/>
  <circle cx="8" cy="8" r="3.3" fill="none" stroke="#d9dbd9" stroke-width="0.25"/>
  <path d="M8 10.2 6.05 8.3a1.25 1.25 0 0 1 1.75-1.75L8 6.75l0.2-0.2a1.25 1.25 0 0 1 1.75 1.75z" fill="#eda0c0"/>
</svg>
