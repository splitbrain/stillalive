<svg xmlns="http://www.w3.org/2000/svg" width="22" height="52" viewBox="0 0 22 52">
  <!-- a white mouse outline with the left button filled, in two frames one above the other: at rest, and with three short lines of a click at the left button -->
  <defs>
    <g id="mouse">
      <path d="M8 1.5C3.5 1.5 2 5 2 9L8 9Z" fill="#ffffff"/>
      <path d="M8 1.5C3.5 1.5 2 5 2 10 2 16.5 4.5 20.5 8 20.5 11.5 20.5 14 16.5 14 10 14 5 12.5 1.5 8 1.5Z" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M2 9 14 9M8 1.5 8 9" stroke="#ffffff" stroke-width="1.2"/>
    </g>
  </defs>
  <use href="#mouse" transform="translate(4 4)"/>
  <g transform="translate(4 30)">
    <use href="#mouse"/>
    <g stroke="#ffffff" stroke-width="1.4" stroke-linecap="round">
      <path d="M-1 4-3.5 3"/>
      <path d="M0.5 1-1.5-1"/>
      <path d="M3.5-0.5 3-3"/>
    </g>
  </g>
</svg>
