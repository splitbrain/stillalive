<svg xmlns="http://www.w3.org/2000/svg" width="64" height="16" viewBox="0 0 64 16">
  <!-- slotted screw heads for the panels, side by side with the slot at four angles. Each view shows one screw. -->
  <defs>
    <g id="screw">
      <path d="M1.6 7.6C1.8 4 4.6 1.5 8.2 1.6 11.8 1.8 14.5 4.6 14.3 8.2 14.1 11.7 11.2 14.4 7.6 14.3 4 14.1 1.4 11.2 1.6 7.6z" fill="#c3e3f3" stroke="#306b82" stroke-width="1.2"/>
      <path d="M3.7 8.3 12.3 7.7" stroke="#306b82" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <g id="shadow">
      <ellipse cx="8.7" cy="9" rx="6.6" ry="6.4" fill="#306b82" opacity="0.45"/>
    </g>
  </defs>
  <view id="a" viewBox="0 0 16 16"/>
  <view id="b" viewBox="16 0 16 16"/>
  <view id="c" viewBox="32 0 16 16"/>
  <view id="d" viewBox="48 0 16 16"/>
  <g>
    <use href="#shadow"/>
    <use href="#screw" transform="rotate(-40 8 8)"/>
  </g>
  <g transform="translate(16 0)">
    <use href="#shadow"/>
    <use href="#screw" transform="rotate(15 8 8)"/>
  </g>
  <g transform="translate(32 0)">
    <use href="#shadow"/>
    <use href="#screw" transform="rotate(75 8 8)"/>
  </g>
  <g transform="translate(48 0)">
    <use href="#shadow"/>
    <use href="#screw" transform="rotate(-10 8 8)"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round">
    <path d="M4 6.2C4.6 4.4 6.2 3.3 8 3.3"/>
    <path d="M20 6.2C20.6 4.4 22.2 3.3 24 3.3"/>
    <path d="M36 6.2C36.6 4.4 38.2 3.3 40 3.3"/>
    <path d="M52 6.2C52.6 4.4 54.2 3.3 56 3.3"/>
  </g>
</svg>
