<svg xmlns="http://www.w3.org/2000/svg" width="64" height="32" viewBox="0 0 64 32">
  <!-- square push button of an old instrument: a thin dark bezel and a light square cap with a lip. Two views: prev and next. -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#e4f1f8"/>
      <stop offset="1" stop-color="#b4d6e8"/>
    </linearGradient>
    <g id="button">
      <!-- shadow on the plate -->
      <path d="M6.4 7.8 26.2 7.4 27 27.6 7.2 28z" fill="#1a3a4a" opacity="0.45"/>
      <!-- thin bezel around the cap -->
      <path d="M4.6 5.8C4.5 5.3 4.9 4.9 5.4 4.9L24.6 4.6C25.1 4.6 25.5 5 25.5 5.5L25.8 24.8C25.8 25.3 25.4 25.7 24.9 25.7L5.7 26C5.2 26 4.8 25.6 4.8 25.1z" fill="#2c4e5e" stroke="#1c3440" stroke-width="0.9"/>
      <!-- cap lip, the lower darker side of the cap -->
      <path d="M6.4 8.1 23.8 7.7 24.2 24.4 6.9 24.8z" fill="#5f93ad"/>
      <!-- cap top -->
      <path d="M6.2 6.6 23.6 6.2 23.9 22.4 6.6 22.8z" fill="url(#top)" stroke="#306b82" stroke-width="0.9" stroke-linejoin="round"/>
      <!-- rim highlight -->
      <path d="M7.8 8.2 22 7.9" fill="none" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" opacity="0.8"/>
    </g>
    <path id="arrow" d="M10.4 14.6 17.8 10.2 17.6 19.2z" fill="#306b82"/>
  </defs>
  <view id="prev" viewBox="0 0 32 32"/>
  <view id="next" viewBox="32 0 32 32"/>
  <g>
    <use href="#button"/>
    <use href="#arrow"/>
  </g>
  <g transform="translate(32 0)">
    <use href="#button"/>
    <use href="#arrow" transform="matrix(-1 0 0 1 30.2 0)"/>
  </g>
</svg>
