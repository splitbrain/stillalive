<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- a piece of masking tape, stuck on crooked with one corner peeled off, with a pen sketch of a framed landscape -->
  <g transform="rotate(-7 16 16)">
    <!-- the shadow of the tape on the plate -->
    <path d="M2.6 9.3 25.5 8.8 29.0 12.0 29.6 24.7 3.1 25.0z" fill="#1a3a4a" opacity="0.28" transform="translate(0.5 0.7)"/>
    <!-- tape, the ends torn, the top right corner cut off where it peels -->
    <path d="M2.0 8.6C9 8.2 17 8.5 25.5 8.2L29.0 11.4 29.1 14.1 28.1 15.0 29.7 17.6 28.6 19.0 29.3 21.2 28.3 22.7 29.5 24.0C21 24.4 11 24.1 2.4 24.3L3.3 23.0 2.7 21.1 3.6 19.6 2.2 17.0 3.1 16.4 2.3 13.7 3.9 12.9 2.6 10.4 3.4 9.8z" fill="#efe3ad" opacity="0.93"/>
    <!-- the peeled corner, folded back, shows its lighter sticky side -->
    <path d="M25.9 8.6 29.2 11.8 26.0 11.7z" fill="#1a3a4a" opacity="0.3" transform="translate(0.4 0.5)"/>
    <path d="M25.5 8.2 29.0 11.4 25.7 11.5z" fill="#f9f3d6"/>
    <path d="M25.5 8.2 29.0 11.4" fill="none" stroke="#c9b878" stroke-width="0.5"/>
    <!-- the sketch: the frame is one fast stroke that bulges and overlaps its start, the mountains jitter, the sun is a double loop -->
    <g fill="none" stroke="#3b4a52" stroke-linecap="round" stroke-linejoin="round">
      <path stroke-width="1.15" d="M9.1 12.6C10.5 12.2 12 12.9 13.6 12.4 15.2 12 17 12.7 18.8 12.2 20.6 11.8 22.6 12.6 23.9 11.9 23.6 13.6 24.3 15.1 23.7 16.8 23.2 18.4 24.2 19.4 23.5 20.6 21 20.2 19.2 20.9 16.6 20.4 14.2 20 12.6 20.9 10.4 20.3 9.6 20.1 8.8 20.6 8.3 20.1 8.6 18.4 8 16.6 8.5 14.8 8.9 13.4 8.1 12.2 8.9 11.4 9.2 11.3 9.9 11.7 10.6 11.6"/>
      <path stroke-width="1.3" d="M9.8 19.6 10.6 18.3 11.1 17.6 11.7 16.4 12.3 15.7 12.8 15 13.4 14.4 13.8 14.7 14.3 15.5 14.9 16.1 15.3 16.9 15.8 17.4 16.3 18.1 16.8 18.3 17.1 17.6 17.6 16.8 18.1 16.1 18.6 15.5 19.2 15.1 19.6 15.4 20.1 16.2 20.6 16.9 21.2 17.8 21.6 18.6 22.2 19.4"/>
      <path stroke-width="1" d="M19.4 13.6C19.2 12.4 20.4 12 21 12.7 21.6 13.4 20.9 14.4 20 14.2 19.3 14 19.4 13 20 12.9 20.6 12.8 20.9 13.5 20.5 13.9"/>
      <path stroke-width="0.8" d="M21.8 11.7 22.3 11.1M22.4 13.1 23.1 13.2M12.9 20.9 13.5 20.8"/>
    </g>
  </g>
</svg>
