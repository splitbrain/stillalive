<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <!-- parts of the front of a VCR, drawn a little crooked with dark ink lines. Each view shows one part: the tape flap upright and on its side, the stop, play and fast buttons, and the grille. -->
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#e4f1f8"/>
      <stop offset="1" stop-color="#b4d6e8"/>
    </linearGradient>
    <linearGradient id="flap-face" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0" stop-color="#4f8aa5"/>
      <stop offset="1" stop-color="#3d7590"/>
    </linearGradient>
    <!-- the tape flap upright, 44 x 130: a dark slot, the flap in it with a hinge at the top and a torn label edge -->
    <g id="tape">
      <path d="M4.6 3.4C10 2.6 33 2.2 39.4 2.8 40.4 40 41 90 40.6 126.8 33 127.4 12 127.8 4.2 127.2 3.4 90 3.6 40 4.6 3.4z" fill="#1a3a4a" stroke="#1c3440" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M9 9.6 36.2 8.8 37 121.4 9.8 122.2z" fill="url(#flap-face)" stroke="#1c3440" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M9.2 13.6 36.3 12.6" fill="none" stroke="#1c3440" stroke-width="1"/>
      <path d="M13.4 18.2 31.8 17.6 32.6 108.6 31.4 110.2 32.4 112 30.6 113.2 31.6 114.8 14.4 115.4z" fill="#36697f" stroke="#24495a" stroke-width="0.9" stroke-linejoin="round"/>
      <path d="M11.4 11.2 34 10.6" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>
      <path d="M34.8 20 35.3 92" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.25"/>
    </g>
    <!-- a push button, 60 x 36: the dark lip below the cap, the cap and a highlight -->
    <g id="button">
      <path d="M5.4 12.4 57.2 10.6 58.4 33.6 6.4 35z" fill="#1a3a4a" opacity="0.3"/>
      <path d="M3.4 8.6C3.3 7.6 4 7 5 7L54.8 5.2C55.8 5.2 56.4 5.8 56.4 6.8L57.2 30.2C57.2 31.2 56.6 31.8 55.6 31.8L5.6 33.4C4.6 33.4 4 32.8 3.9 31.8z" fill="#5f93ad" stroke="#1c3440" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M3.6 6.4C3.5 5.2 4.2 4.4 5.4 4.4L54.2 2.8C55.4 2.8 56.2 3.5 56.2 4.7L56.6 24.4C56.6 25.6 55.9 26.4 54.7 26.4L5.6 27.6C4.4 27.6 3.7 26.9 3.7 25.7z" fill="url(#cap)" stroke="#306b82" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M8 6.8 34 6 M38 5.9 44 5.7" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
    </g>
  </defs>

  <view id="flap" viewBox="0 0 44 130"/>
  <view id="flap-wide" viewBox="50 128 130 44"/>
  <view id="stop" viewBox="150 0 60 36"/>
  <view id="play" viewBox="210 0 60 36"/>
  <view id="fast" viewBox="270 0 60 36"/>
  <view id="grille" viewBox="330 0 60 30"/>

  <use href="#tape"/>
  <use href="#tape" transform="translate(50 172) rotate(-90)"/>

  <g transform="translate(150 0)">
    <use href="#button"/>
    <path d="M24.4 9.4 35.6 9 36 20.4 24.8 20.8z" fill="#306b82" stroke="#306b82" stroke-width="0.8" stroke-linejoin="round"/>
  </g>
  <g transform="translate(210 0)" fill="#306b82" stroke="#306b82" stroke-width="0.8" stroke-linejoin="round">
    <use href="#button" fill="none" stroke="none"/>
    <path d="M19 8.8 30.6 15.2 19.4 21.6z"/>
    <path d="M33 9.2 35.6 9.1 35.9 21 33.3 21.1z"/>
    <path d="M38.4 9 41 8.9 41.3 20.8 38.7 20.9z"/>
  </g>
  <g transform="translate(270 0)" fill="#306b82" stroke="#306b82" stroke-width="0.8" stroke-linejoin="round">
    <use href="#button" fill="none" stroke="none"/>
    <path d="M19.6 9.2 29.6 15 19.9 20.8z"/>
    <path d="M29.8 9 39.8 14.8 30.1 20.6z"/>
  </g>

  <g transform="translate(330 0)">
    <path d="M2.6 3.8 57 2.4 57.8 27.2 3.4 28.4z" fill="#5f93ad" stroke="#1c3440" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M6.6 6.8 53.6 5.8 54.2 24.2 7.2 25.2z" fill="#1a3a4a" stroke="#1c3440" stroke-width="1" stroke-linejoin="round"/>
    <g fill="none" stroke="#306b82" stroke-width="1.8" stroke-linecap="round">
      <path d="M11 9.8 49.8 9"/>
      <path d="M11.2 13.2 50 12.6"/>
      <path d="M11.3 16.7 50.2 16"/>
      <path d="M11.4 20.2 50.3 19.6"/>
    </g>
    <path d="M5 5.2 30 4.6" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.35"/>
  </g>
</svg>
