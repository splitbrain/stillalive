<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="title" content="Still Alive: Portal 2D in your web browser!" />

		<link rel="shortcut icon" href="favicon.ico" />

		<title>Still Alive: Portal 2D in your web browser!</title>
		<script type="module" src="js/main.js"></script>

		<link rel="preload" href="fonts/yikes.ttf" as="font" type="font/ttf" crossorigin />

		<link rel="stylesheet" type="text/css" href="style.css" />
	</head>
	<body>
		<game-app>
			<div class="top">
				<img class="logo" src="gfx/site/logo.svg" alt="Still Alive (revived)" />
				<robot-head hidden></robot-head>
				<narrator-text hidden></narrator-text>
				<p class="tagline"><span>Shoot portals.</span> <span>Solve puzzles.</span> <span>Stay alive.</span></p>
				<img class="mascot" src="gfx/site/character.svg" alt="" />
			</div>
			<div class="side-deco"></div>
			<crt-screen>
				<game-stage hidden></game-stage>
				<vcr-display hidden></vcr-display>
				<loading-screen></loading-screen>
				<credits-screen hidden></credits-screen>
				<main-menu hidden></main-menu>
				<pause-menu hidden></pause-menu>
				<intermission-panel hidden></intermission-panel>
				<level-selection hidden></level-selection>
				<editor-files hidden></editor-files>
				<confirm-screen hidden></confirm-screen>
			</crt-screen>
			<game-hud hidden></game-hud>
			<vcr-panel hidden></vcr-panel>
			<editor-palette hidden></editor-palette>
			<editor-buttons hidden></editor-buttons>
		</game-app>
		<footer>
			<div>
				All code licensed under <a href="https://www.gnu.org/licenses/agpl-3.0.html">AGPL</a><br />
				<a href="https://github.com/splitbrain/stillalive">GitHub</a> &middot;
				<a href="about.html">About</a>
			</div>
			<div>
				Code and Game Design &copy; 2009-2011 Christophe "t4ils"<br />
				Original Graphics &copy; 2010 "ZeBlackos"<br />
				Revive &copy; 2026 Andreas "splitbrain" Gohr
			</div>
		</footer>
	</body>
</html>
