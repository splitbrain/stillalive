<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="title" content="StillAliveJS : Portal 2D in your web navigator !" />

		<link rel="shortcut icon" href="favicon2.ico" />

		<title>StillAliveJS : Portal 2D in your web navigator !</title>
		<script type="module" src="js/main.js"></script>

		<link rel="stylesheet" type="text/css" href="style.css" />
	</head>
	<body>
		<div id="game" data-screen="loading">
			<div id="robot">
				<img id="robot-head" src="sprites/robotHead.png" alt="" />
				<div id="robot-eye"></div>
			</div>
			<div id="speech"><p id="narrator"></p></div>
			<div id="stats">
				<div class="stat"><span class="label">Life</span><span class="value" id="stat-life">100</span></div>
				<div class="stat"><span class="label">Cakes</span><span class="value" id="stat-cakes">0</span></div>
				<div class="stat"><span class="label">Steps</span><span class="value" id="stat-steps">0</span></div>
				<div class="stat"><span class="label">Portals</span><span class="value" id="stat-portals">0</span></div>
			</div>
			<div id="stage">
				<canvas id="canvas" width="640" height="544"> Your browser doesn't support canvas. </canvas>
				<div id="overlay" data-menu="">
					<div id="main-menu" class="menu">
						<button class="big" id="main-classic" data-menu="main" data-button="0">Classic Mode</button>
						<button class="big" id="main-enhanced" data-menu="main" data-button="1">Enhanced Mode</button>
						<button class="big" id="main-ultimate" data-menu="main" data-button="2">Ultimate Mode</button>
						<button class="big" id="main-editor" data-menu="main" data-button="3">Level Editor</button>
						<button class="big" id="main-tutorial" data-menu="main" data-button="4">Tutorial</button>
						<button id="sound-button" title="Click here or press M to turn the sound on and off.">SFX</button>
					</div>
					<div id="pause-menu" class="menu">
						<div class="buttons">
							<button class="small" id="pause-resume" data-menu="pause" data-button="1">Resume</button>
							<button class="small" id="pause-restart" data-menu="pause" data-button="2">Restart</button>
							<button class="small" id="pause-exit" data-menu="pause" data-button="3">Exit</button>
						</div>
						<div class="buttons">
							<button class="small" id="pause-sound" data-menu="pause" data-button="4">Sounds : On</button>
						</div>
					</div>
					<div id="intermission" class="menu">
						<p id="intermission-time"></p>
						<p id="intermission-message"></p>
						<div class="buttons">
							<button class="small" id="intermission-exit" data-menu="intermission" data-button="1">Exit</button>
							<button class="small" id="intermission-restart" data-menu="intermission" data-button="2">Restart</button>
							<button class="small" id="intermission-continue" data-menu="intermission" data-button="3">
								Continue
							</button>
							<button class="small" id="intermission-replay" data-menu="intermission" data-button="4">
								Watch Replay
							</button>
						</div>
					</div>
					<div id="selection-menu" class="menu">
						<div class="buttons">
							<button class="small" id="selection-exit" data-menu="selection" data-button="2">Exit</button>
							<button class="small" id="selection-mode" data-menu="selection" data-button="3">Hard Mode</button>
							<button class="small" id="selection-play" data-menu="selection" data-button="1">Play</button>
						</div>
					</div>
				</div>
			</div>
			<div id="side">
				<div id="level-list"></div>
				<div id="highscores">
					<div id="highscores_in"></div>
				</div>
				<div id="keys">
					<div class="row">
						<span class="mouse" id="key-left"></span>
						<span class="key" id="key-KeyW">W</span>
						<span class="key" id="key-KeyE">E</span>
						<span class="mouse" id="key-right"></span>
					</div>
					<div class="row">
						<span class="key" id="key-KeyA">A</span>
						<span class="key" id="key-KeyS">S</span>
						<span class="key" id="key-KeyD">D</span>
					</div>
				</div>
			</div>
			<div id="footer">
				Copyright (c) 2010 Christophe<br />
				Source code licensed under the
				<a href="https://www.gnu.org/licenses/agpl-3.0.html">GNU Affero General Public License</a><br />
				Audio licensed under
				<a href="https://creativecommons.org/licenses/by-sa/3.0/">Creative Commons Attribution-ShareAlike</a><br />
				Graphics copyright (c) 2010 ZeBlackos
			</div>
		</div>
	</body>
</html>
