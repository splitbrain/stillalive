<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="title" content="StillAliveJS : Portal 2D in your web navigator !" />

		<link rel="shortcut icon" href="favicon2.ico" />

		<title>StillAliveJS : Portal 2D in your web navigator !</title>
		<script type="module" src="js/main.js"></script>

		<link rel="stylesheet" type="text/css" href="style.css" />
	</head>
	<body>
		<game-app data-screen="loading">
			<narrator-text data-screens="select play editor editor-file" hidden></narrator-text>
			<game-stage data-screens="select play editor editor-file" hidden></game-stage>
			<loading-screen data-screens="loading"></loading-screen>
			<credits-screen data-screens="credits" hidden></credits-screen>
			<main-menu data-screens="main" hidden></main-menu>
			<play-screen data-screens="play" hidden></play-screen>
			<editor-screen data-screens="editor editor-file" hidden></editor-screen>
			<level-selection data-screens="select" hidden></level-selection>
			<best-times data-screens="select play" hidden></best-times>

				Graphics copyright (c) 2010 ZeBlackos
			</footer>
		</game-app>
	</body>
</html>
