<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="title" content="Still Alive: Portal 2D in your web browser!" />
		<meta
			name="description"
			content="Shoot portals. Solve puzzles. Stay alive. A 2D puzzle platformer inspired by Portal, free to play in your web browser."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Still Alive" />
		<meta property="og:title" content="Still Alive: Portal 2D in your web browser!" />
		<meta
			property="og:description"
			content="Shoot portals. Solve puzzles. Stay alive. A 2D puzzle platformer inspired by Portal, free to play in your web browser."
		/>
		<meta property="og:url" content="https://splitbrain.github.io/stillalive/" />
		<meta property="og:image" content="https://splitbrain.github.io/stillalive/gfx/site/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="The Still Alive logo next to a game level with two open portals" />
		<meta name="twitter:card" content="summary_large_image" />

		<link rel="shortcut icon" href="favicon.ico" />

		<title>Still Alive: Portal 2D in your web browser!</title>
		<script type="module" src="js/main.js"></script>

		<link rel="preload" href="fonts/yikes.ttf" as="font" type="font/ttf" crossorigin />

		<link rel="stylesheet" type="text/css" href="style.css" />
	</head>
	<body>
		<ui-root>
			<div class="top">
				<img class="logo" src="gfx/site/logo.svg" alt="Still Alive (revived)" />
				<ui-robot-head hidden></ui-robot-head>
				<ui-narrator-text hidden></ui-narrator-text>
				<p class="tagline"><span>Shoot portals.</span> <span>Solve puzzles.</span> <span>Stay alive.</span></p>
				<img class="mascot" src="gfx/site/character.svg" alt="" />
			</div>
			<div class="side-deco"></div>
			<ui-crt>
				<game-stage hidden></game-stage>
				<ui-vcr-display hidden></ui-vcr-display>
				<ui-loading></ui-loading>
				<ui-credits hidden></ui-credits>
				<ui-main-menu hidden></ui-main-menu>
				<ui-pause-menu hidden></ui-pause-menu>
				<ui-intermission hidden></ui-intermission>
				<ui-level-selection hidden></ui-level-selection>
				<ui-editor-files hidden></ui-editor-files>
				<ui-dialog hidden></ui-dialog>
			</ui-crt>
			<ui-hud hidden></ui-hud>
			<ui-vcr-panel hidden></ui-vcr-panel>
			<ui-editor-palette hidden></ui-editor-palette>
			<ui-editor-buttons hidden></ui-editor-buttons>
		</ui-root>
		<footer>
			<div>
				All code licensed under <a href="https://www.gnu.org/licenses/agpl-3.0.html">AGPL</a><br />
				<a href="https://github.com/splitbrain/stillalive">GitHub</a> &middot;
				<a href="about.html">About</a>
			</div>
			<div>
				Code and Game Design &copy; 2009-2011 Christophe "t4ils"<br />
				Original Graphics &copy; 2010 "ZeBlackos"<br />
				Revive &copy; 2026 Andreas "splitbrain" Gohr
			</div>
		</footer>
	</body>
</html>
