<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="title" content="StillAliveJS : Portal 2D in your web navigator !" />

		<link rel="shortcut icon" href="favicon2.ico" />

		<title>StillAliveJS : Portal 2D in your web navigator !</title>
		<script type="module" src="js/main.js"></script>

		<link rel="stylesheet" type="text/css" href="style.css" />
	</head>
	<body>
		<div id="game" data-screen="loading">
			<div id="robot">
				<img id="robot-head" src="sprites/robotHead.svg" alt="" />
				<div id="robot-eye"></div>
			</div>
			<div id="speech"><p id="narrator"></p></div>
			<div id="editor-tiles" hidden></div>
			<div id="editor-objects" hidden>
				<button data-sprite="103" title="Cake"><span class="sprite cake"></span></button>
				<button data-sprite="102" title="Crate"><span class="sprite crate"></span></button>
				<button data-sprite="100" title="Turret, facing left"><span class="sprite turret-left"></span></button>
				<button data-sprite="101" title="Turret, facing right"><span class="sprite turret-right"></span></button>
				<button data-sprite="105" title="Platform, moving right" class="wide">
					<span class="sprite platform"></span><span class="arrow">&#9654;</span>
				</button>
				<button data-sprite="106" title="Platform, moving left" class="wide">
					<span class="sprite platform"></span><span class="arrow">&#9664;</span>
				</button>
				<button data-sprite="104" title="Player start">
					<span class="sprite player"><span class="head"></span></span>
				</button>
				<button data-sprite="107" title="Gravitational pipe: carries the player and objects to the right">
					<span class="sprite gravpipe-right"></span>
				</button>
				<button data-sprite="108" title="Gravitational pipe: carries the player and objects to the left">
					<span class="sprite gravpipe-left"></span>
				</button>
				<button data-sprite="109" title="Gravitational pipe: carries the player and objects up" class="wide">
					<span class="sprite gravpipe-up"></span>
				</button>
				<button data-sprite="110" title="Gravitational pipe: carries the player and objects down" class="wide">
					<span class="sprite gravpipe-down"></span>
				</button>
				<div id="editor-bg">
					<button data-bg="-1" title="Previous background">&#9664;</button>
					<button data-bg="1" title="Next background">&#9654;</button>
				</div>
			</div>
			<div id="stats">
				<div class="stat"><span class="label">Life</span><span class="value" id="stat-life">100</span></div>
				<div class="stat"><span class="label">Cakes</span><span class="value" id="stat-cakes">0</span></div>
				<div class="stat"><span class="label">Steps</span><span class="value" id="stat-steps">0</span></div>
				<div class="stat"><span class="label">Portals</span><span class="value" id="stat-portals">0</span></div>
			</div>
			<div id="stage">
				<game-stage id="game-stage"></game-stage>
				<div id="overlay" data-menu="">
					<div id="loading-screen" hidden></div>
					<div id="credits" hidden></div>
					<div id="main-menu" class="menu">
						<button class="big" id="main-classic">Classic Mode</button>
						<button class="big" id="main-enhanced">Enhanced Mode</button>
						<button class="big" id="main-ultimate">Ultimate Mode</button>
						<button class="big" id="main-editor">Level Editor</button>
						<button class="big" id="main-tutorial">Tutorial</button>
						<button id="sound-button" title="Click here or press M to turn the sound on and off.">SFX</button>
					</div>
					<div id="pause-menu" class="menu">
						<div class="buttons">
							<button class="small" id="pause-resume">Resume</button>
							<button class="small" id="pause-restart">Restart</button>
							<button class="small" id="pause-exit">Exit</button>
						</div>
						<div class="buttons">
							<button class="small" id="pause-sound">Sounds : On</button>
						</div>
					</div>
					<div id="intermission" class="menu">
						<p id="intermission-time"></p>
						<p id="intermission-message"></p>
						<div class="buttons">
							<button class="small" id="intermission-exit">Exit</button>
							<button class="small" id="intermission-restart">Restart</button>
							<button class="small" id="intermission-continue">Continue</button>
							<button class="small" id="intermission-replay">Watch Replay</button>
						</div>
					</div>
					<div id="selection-menu" class="menu">
						<div class="buttons">
							<button class="small" id="selection-exit">Exit</button>
							<button class="small" id="selection-mode">Hard Mode</button>
							<button class="small" id="selection-play">Play</button>
						</div>
					</div>
					<div id="editor-menu" class="menu">
						<div class="buttons">
							<button class="small" id="editor-exit">Exit</button>
							<button class="small" id="editor-clear">Clear</button>
							<button class="small" id="editor-try">Try Map</button>
							<button class="small" id="editor-help">Help</button>
							<button class="small" id="editor-load">Load</button>
							<button class="small" id="editor-save">Save</button>
						</div>
					</div>
					<div id="editor-file" class="menu">
						<div class="buttons">
							<button class="small" id="editor-file-exit">Exit</button>
							<button class="small" id="editor-export">Export</button>
							<button class="small" id="editor-import">Import</button>
							<button class="small" id="editor-accept">Save</button>
						</div>
					</div>
				</div>
			</div>
			<div id="side">
				<div id="level-list"></div>
				<div id="slot-list" hidden></div>
				<div id="highscores">
					<div id="highscores_in"></div>
				</div>
				<div id="keys">
					<div class="row">
						<span class="mouse" id="key-left"></span>
						<span class="key" id="key-KeyW">W</span>
						<span class="key" id="key-KeyE">E</span>
						<span class="mouse" id="key-right"></span>
					</div>
					<div class="row">
						<span class="key" id="key-KeyA">A</span>
						<span class="key" id="key-KeyS">S</span>
						<span class="key" id="key-KeyD">D</span>
					</div>
				</div>
			</div>
			<div id="footer">
				Copyright (c) 2010 Christophe<br />
				Source code licensed under the
				<a href="https://www.gnu.org/licenses/agpl-3.0.html">GNU Affero General Public License</a><br />
				Audio licensed under
				<a href="https://creativecommons.org/licenses/by-sa/3.0/">Creative Commons Attribution-ShareAlike</a><br />
				Graphics copyright (c) 2010 ZeBlackos
			</div>
		</div>
	</body>
</html>
