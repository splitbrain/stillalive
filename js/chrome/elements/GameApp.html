<style>
	/*
	 * The app is a grid that is centered horizontally in the window. Its first two rows and columns are a block of four
	 * cells: a narrow corner and top row and a narrow side column around a large main cell. The width of this block
	 * follows the window up to a maximum. The height follows the window too, but the main cell is never higher than the
	 * aspect ratio of the playfield allows. The parts adjust to their cells. The other parts go in rows below it, each in
	 * the full width. The block leaves room for the row of the editor buttons while they show.
	 */
	game-app {
		/* the top row is at least as high as the narrator text with four lines of text */
		--grid-row-top-min: 149px;
		--grid-gap: 1rem;
		--grid-width: min(100vw - 2rem, 1400px);
		--editor-buttons-height: clamp(2rem, var(--grid-width) * 0.032, 3rem);
		--grid-row-bottom: 0px;
		--grid-height: min(100dvh - 2rem - var(--grid-row-bottom), var(--grid-col-main) * 3 / 4 / 0.85 + var(--grid-gap));
		--grid-col-side: calc((var(--grid-width) - var(--grid-gap)) * 0.15);
		--grid-col-main: calc(var(--grid-width) - var(--grid-gap) - var(--grid-col-side));
		--grid-row-top: max((var(--grid-height) - var(--grid-gap)) * 0.15, var(--grid-row-top-min));
		--grid-row-main: calc(var(--grid-height) - var(--grid-gap) - var(--grid-row-top));
		display: grid;
		grid-template:
			'corner top' var(--grid-row-top)
			'side main' var(--grid-row-main)
			/ var(--grid-col-side) var(--grid-col-main);
		gap: var(--grid-gap);
		justify-content: center;
		padding-top: 1rem;

		/* on a window that is taller than wide, the main cell takes the full width and the side cell goes below it */
		@media (orientation: portrait) {
			--grid-height: min(100dvh - 2rem - var(--grid-row-bottom), var(--grid-width) * 3 / 4 / 0.7 + 2 * var(--grid-gap));
			--grid-row-side: calc((var(--grid-height) - 2 * var(--grid-gap)) * 0.15);
			--grid-row-top: max((var(--grid-height) - 2 * var(--grid-gap)) * 0.15, var(--grid-row-top-min));
			--grid-row-main: calc(var(--grid-height) - 2 * var(--grid-gap) - var(--grid-row-top) - var(--grid-row-side));
			grid-template:
				'corner top' var(--grid-row-top)
				'main main' var(--grid-row-main)
				'side side' var(--grid-row-side)
				/ var(--grid-col-side) var(--grid-col-main);
		}

		&:has(> editor-buttons:not([hidden])) {
			--grid-row-bottom: calc(var(--editor-buttons-height) + var(--grid-gap));
		}

		> * {
			grid-column: 1 / -1;
		}

		/*
		 * The robot head and the narrator text share the first row and have its height. The robot head keeps its aspect
		 * ratio, and the narrator text takes the rest of the width.
		 */
		> .top {
			grid-row: corner;
			grid-column: corner-start / top-end;
			display: flex;
			gap: var(--grid-gap);

			> robot-head {
				aspect-ratio: 108 / 92;
			}

			> narrator-text {
				flex: 1;
				--narrator-height: var(--grid-row-top);
			}

			/*
			 * The logo shows in the left corner while the robot head and the narrator text are hidden. It is larger than
			 * the corner and reaches into the empty top row and side column.
			 */
			> .logo {
				width: calc(var(--grid-col-side) * 2.1);
				align-self: start;
				position: relative;
				z-index: 1;
			}

			/* the character stands at the right end of the row and points to the left, at the same times as the logo */
			> .mascot {
				height: 100%;
				margin-left: auto;
			}

			&:has(> robot-head:not([hidden]), > narrator-text:not([hidden])) > :is(.logo, .mascot) {
				display: none;
			}
		}

		/* the HUD and the editor palette fill the side cell */
		> game-hud {
			grid-area: side;
			aspect-ratio: auto;
		}

		> editor-palette {
			grid-area: side;
		}

		/*
		 * The dome on the chain shelf decorates the side cell while the side cell is left of the CRT and the HUD and the
		 * editor palette are hidden. It fills the width of the cell, or its height when the cell is too low. Its pipe
		 * continues up to the top of the page, with a cap at the top, and right into the main cell, where it ends behind
		 * the left edge of the CRT. The decoration lies behind all other parts.
		 */
		> .side-deco {
			--deco-unit: min(var(--grid-col-side) / 246.5, var(--grid-row-main) / 572);
			--pipe-bands:
				#527080 12.5%, #456472 12.5% 22.5%, #3d5b6b 22.5% 30%, #38515d 30% 38%, #36434f 38% 62%,
				#38515d 62% 70%, #3d5b6b 70% 77.5%, #456472 77.5% 87.5%, #527080 87.5%;
			grid-area: side;
			position: relative;
			z-index: -1;
			width: calc(var(--deco-unit) * 246.5);
			height: calc(var(--deco-unit) * 572);
			background: url('images/dome-shelf.svg') center / 100% 100% no-repeat;

			&::before,
			&::after {
				content: '';
				position: absolute;
			}

			&::before {
				left: calc(var(--deco-unit) * -2.5);
				bottom: 100%;
				width: calc(var(--deco-unit) * 44.5);
				height: calc(1rem + var(--grid-row-top) + var(--grid-gap));
				background:
					linear-gradient(to right, #3c6b7c, #213645, #3c6b7c) top / 100% calc(var(--deco-unit) * 17) no-repeat,
					linear-gradient(to right, var(--pipe-bands)) center / calc(var(--deco-unit) * 39.5) 100% no-repeat;
			}

			&::after {
				left: 100%;
				top: calc(var(--deco-unit) * 399.5);
				width: calc(var(--grid-col-side) + var(--grid-gap) + 3rem - var(--deco-unit) * 246.5);
				height: calc(var(--deco-unit) * 60);
				background: linear-gradient(to bottom, var(--pipe-bands));
			}

			@media (orientation: portrait) {
				display: none;
			}
		}

		&:has(> game-hud:not([hidden]), > editor-palette:not([hidden])) > .side-deco {
			display: none;
		}

		/*
		 * The CRT screen shows the stage and the parts that show in its place. Its content has the aspect ratio of the
		 * playfield, so the stage fills the glass.
		 */
		> crt-screen {
			--crt-aspect: 4 / 3;
			grid-area: main;

			/* the parts in the CRT screen lie on top of each other in one cell */
			> * {
				grid-area: 1 / 1;
				min-width: 0;
				min-height: 0;
			}
		}
	}
</style>
