<style>
	/*
	 * The button is a slanted box with the label in the accent color. All buttons have the same slant, but each corner
	 * moves a little around its place by a share of a small range, set by the custom properties --skew-1 to --skew-8 from
	 * 0 to 1. So each button differs slightly from the others. All sizes scale with the CRT screen.
	 */
	menu-button {
		display: block;
		width: 40cqw;
		font: var(--font-title);
		font-size: 3.6cqw;

		&[small] {
			width: 24cqw;
			font-size: 2.4cqw;
		}

		/* a button with a hidden link or button takes no space */
		&:has(> [hidden]) {
			display: none;
		}

		> a,
		> button {
			display: flex;
			align-items: baseline;
			justify-content: center;
			gap: 0.5em;
			width: 100%;
			padding: 0.4em 1.2em 0.3em;
			border: none;
			background: rgb(2 108 103 / 70%);
			clip-path: polygon(
				calc(0% + var(--skew-1, 0.5) * 2%) calc(5.5% + var(--skew-2, 0.5) * 3%),
				calc(98% + var(--skew-3, 0.5) * 2%) calc(0% + var(--skew-4, 0.5) * 3%),
				calc(95% + var(--skew-5, 0.5) * 2%) calc(97% + var(--skew-6, 0.5) * 3%),
				calc(5.5% + var(--skew-7, 0.5) * 2%) calc(91.5% + var(--skew-8, 0.5) * 3%)
			);
			font: inherit;
			color: var(--color-accent);
			text-decoration: none;
			text-shadow: 0.1em 0.1em 0 #000;
			cursor: pointer;
			transition: scale 0.1s;

			&:hover,
			&:focus-visible {
				scale: 0.9;
			}

			/* an extra value, like a count, goes to the right end in a smaller size */
			span {
				margin-left: auto;
				font-size: 0.6em;
				color: var(--color-text);
			}
		}
	}
</style>
