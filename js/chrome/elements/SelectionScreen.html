<style>
	/*
	 * A selection screen covers the whole cell of the screen. It shows the preview behind it in black and white and
	 * darker, and its content centered on top. The back button sits in the top left corner, and the choices fill a grid
	 * of four columns. All sizes scale with the screen.
	 */
	.selection-screen {
		display: flex;
		position: relative;
		align-items: center;
		justify-content: center;
		backdrop-filter: grayscale(1) brightness(0.6);

		.back {
			position: absolute;
			top: 3cqw;
			left: 3cqw;
			width: 6cqw;
			transition: scale 0.1s;

			&:hover,
			&:focus-visible {
				scale: 0.9;
			}

			img {
				display: block;
				width: 100%;
			}
		}

		.choices {
			display: grid;
			grid-template-columns: repeat(4, auto);
			gap: 1.6cqw 2.4cqw;

			> menu-button {
				width: 19cqw;
				font-size: 2.6cqw;
			}
		}
	}
</style>
