<style>

				calc(var(--u) * 1.2) 100%
			);
		}

		/* the bezel lies behind the plate and shows about 2 units around it, a little more at the top */
		&::after {

			}

				display: block;
			}
		}

		/* on a wide plate: the parts in a row, the buttons in a row, the tape flap on its side */
		@container (aspect-ratio > 1) {

					width: calc(var(--k) * 76.8);
					height: calc(var(--k) * 26);
				}
			}

			.keys {
				flex-direction: row;
			}
		}
	}
</style>
