<svg xmlns="http://www.w3.org/2000/svg" width="32" height="64" viewBox="0 0 32 64">
  <!-- frame 0 at the top: on a floor or a ceiling. Frame 1 below: on a wall. -->
  <defs>
    <radialGradient id="field" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00304a" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#00feff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00feff" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="glow" x="-0.2" y="-1" width="1.4" height="3">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <filter id="spark" x="-2" y="-2" width="5" height="5">
      <feGaussianBlur stdDeviation="0.15"/>
    </filter>
    <g id="p">
      <ellipse cx="16" cy="2.6" rx="15.6" ry="2.6" fill="#00feff" opacity="0.55" filter="url(#glow)"/>
      <ellipse cx="16" cy="2.6" rx="14.6" ry="2.1" fill="url(#field)"/>
      <g fill="none" stroke="#e0ffff" stroke-linecap="round" opacity="0.7" stroke-width="0.25">
        <path d="M5 2.9C8 1.4 13 1.3 17 2.2S23 3.5 26.5 2.3"/>
        <path d="M8 3.6C11 2.7 15 3.1 19 3.4 22 3.6 24 3 25.5 2.7" opacity="0.6"/>
        <path d="M7.5 1.7C10 1.2 13 1.4 15.5 1.9" opacity="0.6"/>
      </g>
      <ellipse cx="16" cy="2.6" rx="14.6" ry="2.1" fill="none" stroke="#00feff" stroke-width="0.7"/>
      <ellipse cx="16" cy="2.6" rx="14.2" ry="1.8" fill="none" stroke="#e0ffff" stroke-width="0.25" opacity="0.9"/>
      <g fill="#e0ffff" filter="url(#spark)">
        <circle cx="4.5" cy="1.2" r="0.35"/>
        <circle cx="27" cy="1.1" r="0.3"/>
        <circle cx="21" cy="4.6" r="0.25"/>
        <circle cx="10" cy="4.5" r="0.25"/>
      </g>
    </g>
  </defs>
  <use href="#p"/>
  <use href="#p" transform="translate(0 32) rotate(90 0 0) translate(0 -5.2)"/>
</svg>
